name: Backend Tests

# Run this workflow whenever code is pushed to develop/main, or when a
# Pull Request targets develop/main — this is what "gates" merges with
# real, automated verification.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Lambda unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Report test summary
        if: always()
        run: echo "Test run finished. See logs above for details."